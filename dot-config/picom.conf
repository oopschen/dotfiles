# --- Shadows ---
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.6;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-color = "#1A1A2E";

# --- Fading ---
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 15;
no-fading-openclose = true;

# --- Transparency ---
frame-opacity = 0.7;

# --- Corners ---
corner-radius = 3;

# --- Blur ---
blur: {
  method = "dual_kawase";
  strength = 5; # 强度，可按需调整
};

# --- General (GLX, 性能优先) ---
backend = "glx";
vsync = true;
dithered-present = false;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# --- Rules ---
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
},{
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  match = "window_type = 'dialog' || "
          "window_type = 'utility' ";
  shadow = false;
  full-shadow = false;
  frame-opacity = 0;
}, {
  match = "window_type = 'combo' && "
          "class_g ?= 'fcitx'";
  shadow = false;
  fade = false;
  blur-background = false;
}, {
  match = "window_type = 'dock' && "
          "class_g ?= 'polybar'";
  shadow = false;
  fade = false;
})


