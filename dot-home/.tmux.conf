# ───────── 前缀 ─────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ───────── 性能 / 响应 ─────────
set -sg escape-time 10          # vi 用户必改,默认 500ms
set -sg repeat-time 400
set -g  history-limit 5000     # 每 pane 占内存,按需调整
set -g  focus-events on         # vim autoread / gitgutter 需要
set -g  status-interval 60      # 状态栏只用内置变量,60s 足够
setw -g aggressive-resize on
setw -g automatic-rename-format '#{b:pane_current_path}'  # 比轮询进程名轻
set -g  history-file ~/.cache/tmux/cmd-history.log        # 先 mkdir -p ~/.cache/tmux

# ───────── 终端 / 剪贴板 ─────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"            # tmux ≥ 3.2
# tmux < 3.2 改用: set -ga terminal-overrides ",*256col*:Tc"
set -g  set-clipboard on
set -g  mouse on

# ───────── 基础 ─────────
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g mode-keys vi
set -g  status-keys vi

# ───────── 按键 ─────────
bind r source-file ~/.tmux.conf \; display "reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 你原来的绑定,换成 O 避免覆盖 prefix+o
bind O send-keys Escape ^ i o Space Escape '$' i Enter

# ───────── 配色:Solarized Light(真彩色) ─────────
# base3 #fdf6e3  base2 #eee8d5  base1 #93a1a1  base00 #657b83
# orange #cb4b16  blue #268bd2  green #859900  red #dc322f

set -g status-style                 "fg=#657b83,bg=#eee8d5"
set -g status-left                  " #[bold]#S#[nobold] "
set -g status-left-length           20
set -g status-right                 "%H:%M "     # strftime 内置,无 shell 开销
set -g status-justify               right

setw -g window-status-format        " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-style         "fg=#93a1a1,bg=default"
setw -g window-status-current-style "fg=#cb4b16,bg=default,bold"

set -g pane-border-style            "fg=#93a1a1"
set -g pane-active-border-style     "fg=#268bd2"

set -g message-style                "fg=#cb4b16,bg=#eee8d5"
set -g message-command-style        "fg=#268bd2,bg=#eee8d5"
set -g mode-style                   "fg=#fdf6e3,bg=#268bd2"   # 复制模式选区

set -g display-panes-colour         "#93a1a1"
set -g display-panes-active-colour  "#dc322f"
setw -g clock-mode-colour           "#859900"
